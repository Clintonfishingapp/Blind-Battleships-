<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind Battleships Online</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --navy:#0B1F33; --navy-2:#132C47; --panel:#173a5e; --cream:#F4F1EA;
    --coral:#FF7A57; --coral-dark:#C24E30; --ok:#7FD1AE; --bad:#F2A6A6; --line:#2E5378;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy); color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; min-height:100vh; padding:24px 16px 60px;
  }
  main{ max-width:520px; margin:0 auto; }
  h1{ font-size:26px; font-weight:500; margin:0 0 4px; }
  h2{ font-size:19px; font-weight:500; margin:0 0 14px; outline:none; }
  .tag{ color:#9FC1E0; font-size:14px; margin:0 0 28px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  label{ display:block; font-size:14px; color:#CFE0EF; margin-bottom:6px; }
  input[type=text]{
    width:100%; font-size:18px; padding:12px 14px; border-radius:8px;
    border:1px solid var(--line); background:var(--navy-2); color:var(--cream); margin-bottom:14px;
  }
  input:focus, button:focus{ outline:3px solid var(--coral); outline-offset:2px; }
  button{
    font-size:16px; font-weight:500; padding:12px 18px; border-radius:8px;
    border:1px solid var(--line); background:var(--navy-2); color:var(--cream);
    cursor:pointer; margin:0 8px 8px 0;
  }
  button.primary{ background:var(--coral); border-color:var(--coral-dark); color:#3A1608; }
  button.primary:hover{ background:#ff8c6c; }
  button:hover{ background:#1e4468; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  ul.log{ list-style:none; margin:0; padding:0; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:14px; }
  ul.log li{ padding:8px 10px; border-bottom:1px solid var(--line); }
  ul.log li:last-child{ border-bottom:none; }
  .hit{ color:var(--bad); }
  .miss{ color:#9FC1E0; }
  .status{ font-size:14px; color:#9FC1E0; margin-bottom:10px; }
  .error{ color:var(--bad); font-size:14px; margin:-6px 0 14px; }
  .sr-live{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .visible-announce{ background:var(--navy-2); border:1px solid var(--coral); border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:15px; }
  .ship-list{ font-size:14px; color:#CFE0EF; margin:0 0 14px; padding-left:18px; }
  .fine{ font-size:13px; color:#7FA0C4; }
</style>
</head>
<body>
<main>
  <h1>Blind battleships online</h1>
  <p class="tag">Two boards, one game, any distance apart — updates automatically.</p>

  <div id="app"></div>

  <div class="sr-live" aria-live="polite" id="liveRegion"></div>
</main>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyCzW_eMzHzHuquD5IY_ftWwkDG77ORp9h8",
    authDomain: "blind-battleships-48f6b.firebaseapp.com",
    databaseURL: "https://blind-battleships-48f6b-default-rtdb.firebaseio.com",
    projectId: "blind-battleships-48f6b",
    storageBucket: "blind-battleships-48f6b.firebasestorage.app",
    messagingSenderId: "377607752197",
    appId: "1:377607752197:web:0800596111346cbdb8aa6c"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  var COLS = "ABCDEFGHIJ";
  var SHIPS = [
    {name:"Destroyer", len:2}
  ];
  var TOTAL_CELLS = SHIPS.reduce(function(a,s){return a+s.len;},0);

  var app = document.getElementById("app");
  var live = document.getElementById("liveRegion");

  var myToken = localStorage.getItem("bb3_token");
  if(!myToken){
    myToken = "t" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("bb3_token", myToken);
  }

  var session = {
    phase: "code",       // code | seat | layout | placement | waiting | battle | gameover
    code: localStorage.getItem("bb3_code") || "",
    slot: localStorage.getItem("bb3_slot") || "",
    fleet: [],
    shipIdx: 0,
    error: "",
    joining: false,
    occupancy: null,
    winner: null
  };
  var roomRef = null;
  var roomListener = null;
  var roomDoc = null;
  var lastLogLen = -1;
  var startAttempted = false;

  function announce(text){
    live.textContent = "";
    setTimeout(function(){ live.textContent = text; }, 30);
  }
  function otherSlot(s){ return s === "p1" ? "p2" : "p1"; }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function freshRoom(){
    return { p1:{token:null,ready:false,fleet:null}, p2:{token:null,ready:false,fleet:null},
             turn:null, log:[], winner:null, started:false };
  }
  function normalizeRoom(data){
    var d = data || {};
    return {
      p1: d.p1 || {token:null,ready:false,fleet:null},
      p2: d.p2 || {token:null,ready:false,fleet:null},
      turn: d.turn || null,
      log: d.log || [],
      winner: d.winner || null,
      started: !!d.started
    };
  }

  function parseCell(text){
    var m = /^\s*([A-Ja-j])\s*-?\s*(10|[1-9])\s*$/.exec(text);
    if(!m) return null;
    var col = COLS.indexOf(m[1].toUpperCase());
    var row = parseInt(m[2], 10);
    return {col:col, row:row, key: COLS[col] + row};
  }
  function parsePlacement(text){
    var m = /^\s*([A-Ja-j])\s*-?\s*(10|[1-9])\s*([HhVv])\s*$/.exec(text);
    if(!m) return null;
    var col = COLS.indexOf(m[1].toUpperCase());
    var row = parseInt(m[2], 10);
    var orient = m[3].toUpperCase();
    return {col:col, row:row, orient:orient};
  }
  function shipCells(start, len){
    var cells = [];
    for(var i=0;i<len;i++){
      var c = start.orient === "V" ? start.col + i : start.col;
      var r = start.orient === "H" ? start.row + i : start.row;
      if(c > 9 || r > 10) return null;
      cells.push(COLS[c] + r);
    }
    return cells;
  }
  function fleetOccupied(fleet){
    var set = {};
    fleet.forEach(function(s){ s.cells.forEach(function(c){ set[c]=true; }); });
    return set;
  }
  function describeError(e){
    if(e && e.code) return e.code;
    if(e && e.message) return e.message;
    return "unknown error";
  }

  // ---------------- SOUND EFFECTS ----------------
  var audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ return null; }
    }
    if(audioCtx.state === "suspended"){ audioCtx.resume().catch(function(){}); }
    return audioCtx;
  }
  function playWhistle(){
    var ctx = getAudioCtx(); if(!ctx) return;
    var now = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1800, now);
    osc.frequency.exponentialRampToValueAtTime(500, now + 0.5);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.6);
  }
  function playExplosion(){
    var ctx = getAudioCtx(); if(!ctx) return;
    var now = ctx.currentTime;
    var bufferSize = Math.floor(ctx.sampleRate * 0.6);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(3000, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + 0.5);
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.6, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.6);

    var thump = ctx.createOscillator();
    var thumpGain = ctx.createGain();
    thump.type = "sine";
    thump.frequency.setValueAtTime(120, now);
    thump.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    thumpGain.gain.setValueAtTime(0.5, now);
    thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    thump.connect(thumpGain); thumpGain.connect(ctx.destination);
    thump.start(now); thump.stop(now + 0.4);
  }

  // ---------------- RENDER DISPATCH ----------------
  function render(){
    if(session.phase === "code") return renderCodeStep();
    if(session.phase === "seat") return renderSeatStep();
    if(session.phase === "layout") return renderLayout();
    if(session.phase === "placement") return renderPlacement();
    if(session.phase === "waiting") return renderWaiting();
    if(session.phase === "battle") return renderBattle();
    if(session.phase === "gameover") return renderGameOver();
  }
  function focusHeading(){
    var h = app.querySelector("h2");
    if(h){ h.setAttribute("tabindex","-1"); h.focus(); }
  }

  // ---------------- STEP 1: ROOM CODE ----------------
  function renderCodeStep(){
    app.innerHTML =
      '<div class="panel">' +
        '<h2>Enter the room code</h2>' +
        '<label for="codeInput">Room code (agree on this with your friend, e.g. SHARK7)</label>' +
        '<input type="text" id="codeInput" autocomplete="off" value="' + escapeHtml(session.code) + '">' +
        (session.error ? '<p class="error" role="alert">' + escapeHtml(session.error) + '</p>' : '') +
        '<button type="button" class="primary" id="codeContinueBtn">Continue</button>' +
        '<p class="fine">Use the exact same room code on both phones.</p>' +
      '</div>';
    focusHeading();
    var input = document.getElementById("codeInput");
    input.focus();
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") onCodeContinue(); });
    document.getElementById("codeContinueBtn").onclick = onCodeContinue;
  }

  function onCodeContinue(){
    var code = document.getElementById("codeInput").value.trim().toUpperCase();
    if(!code){ session.error = "Enter a room code first."; return render(); }
    session.code = code;
    session.error = "";
    session.occupancy = null;
    session.phase = "seat";
    render();

    db.ref("rooms/" + code).once("value").then(function(snap){
      var data = normalizeRoom(snap.val());
      session.occupancy = { p1: !!(data.p1 && data.p1.token), p2: !!(data.p2 && data.p2.token) };
      render();
    }).catch(function(e){
      session.error = "Couldn't check that room (" + describeError(e) + "). You can still try picking a seat.";
      session.occupancy = {p1:false, p2:false};
      render();
    });
  }

  // ---------------- STEP 2: CHOOSE SEAT ----------------
  function renderSeatStep(){
    var occ = session.occupancy;
    app.innerHTML =
      '<div class="panel">' +
        '<h2>Choose your seat — room ' + escapeHtml(session.code) + '</h2>' +
        (occ ? '<p class="status">Player 1 is ' + (occ.p1 ? "taken" : "available") + '. Player 2 is ' + (occ.p2 ? "taken" : "available") + '.</p>'
             : '<p class="status">Checking who has already joined...</p>') +
        (session.joining ? '<p class="status" role="status">Joining as ' + (session.joining === "p1" ? "Player 1" : "Player 2") + '... please wait.</p>' : '') +
        '<div class="row" role="group" aria-label="Choose your seat">' +
          '<button type="button" class="seat-btn" id="seatP1"' + (session.joining ? ' disabled' : '') + '>Player 1</button>' +
          '<button type="button" class="seat-btn" id="seatP2"' + (session.joining ? ' disabled' : '') + '>Player 2</button>' +
        '</div>' +
        (session.error ? '<p class="error" role="alert">' + escapeHtml(session.error) + '</p>' : '') +
        '<button type="button" id="backBtn"' + (session.joining ? ' disabled' : '') + '>Use a different room code</button>' +
      '</div>';
    focusHeading();
    if(session.joining){ announce("Joining as " + (session.joining === "p1" ? "Player 1" : "Player 2") + ". Please wait."); return; }
    document.getElementById("seatP1").onclick = function(){ onSeatChosen("p1"); };
    document.getElementById("seatP2").onclick = function(){ onSeatChosen("p2"); };
    document.getElementById("backBtn").onclick = function(){
      session.phase = "code"; session.error = ""; render();
    };
  }

  function onSeatChosen(slot){
    session.slot = slot;
    session.error = "";
    session.joining = slot;
    render();

    var ref = db.ref("rooms/" + session.code);
    var timedOut = false;
    var timer = setTimeout(function(){
      timedOut = true;
      session.joining = false;
      session.error = "This is taking longer than expected. Check your connection and try again.";
      render();
    }, 9000);

    ref.once("value").then(function(snap){
      if(timedOut) return null;
      var data = normalizeRoom(snap.val());
      var mine = data[slot];
      if(mine.token && mine.token !== myToken){
        clearTimeout(timer);
        session.joining = false;
        session.error = "That seat is already taken in this room. Pick the other seat.";
        session.occupancy = session.occupancy || {};
        session.occupancy[slot] = true;
        render();
        return null;
      }
      var patch = {};
      patch[slot + "/token"] = myToken;
      if(!mine.ready) patch[slot + "/ready"] = false;
      return ref.update(patch).then(function(){ return data; });
    }).then(function(data){
      if(timedOut || data === null) return;
      clearTimeout(timer);
      session.joining = false;
      localStorage.setItem("bb3_code", session.code);
      localStorage.setItem("bb3_slot", slot);
      session.error = "";
      startAttempted = false;
      attachRoomListener();

      var mine = data[slot];
      if(mine.ready && mine.fleet && mine.fleet.length === SHIPS.length){
        session.fleet = mine.fleet.map(function(s){ return {name:s.n, len:s.c.length, cells:s.c}; });
        session.shipIdx = SHIPS.length;
        roomDoc = data;
        reconcile(data.log.length);
      } else {
        session.phase = "layout";
        render();
      }
    }).catch(function(e){
      if(timedOut) return;
      clearTimeout(timer);
      session.joining = false;
      session.error = "Couldn't save your seat (" + describeError(e) + "). Check your connection and try again.";
      render();
    });
  }

  // ---------------- LIVE ROOM LISTENER ----------------
  function attachRoomListener(){
    if(roomListener && roomRef) roomRef.off("value", roomListener);
    roomRef = db.ref("rooms/" + session.code);
    roomListener = function(snap){
      var prevLen = roomDoc ? roomDoc.log.length : 0;
      roomDoc = normalizeRoom(snap.val());
      if(session.phase === "code" || session.phase === "seat" || session.phase === "layout" || session.phase === "placement") return;
      reconcile(prevLen);
    };
    roomRef.on("value", roomListener, function(e){
      session.error = "Lost connection to the room (" + describeError(e) + ").";
      render();
    });
  }

  function ensureBattleStarted(){
    if(startAttempted || !roomRef) return;
    startAttempted = true;
    roomRef.update({turn:"p1", log:[], winner:null, started:true}).catch(function(){ startAttempted = false; });
  }

  function reconcile(prevLen){
    if(!roomDoc) return;
    var mine = roomDoc[session.slot];
    var other = roomDoc[otherSlot(session.slot)];

    if(!roomDoc.started){
      if(mine && mine.ready && other && other.ready) ensureBattleStarted();
      session.phase = "waiting";
      render();
      return;
    }
    if(roomDoc.winner){
      session.phase = "gameover";
      session.winner = roomDoc.winner;
      render();
      return;
    }
    session.phase = "battle";
    if(roomDoc.log.length > prevLen){
      var newest = roomDoc.log[roomDoc.log.length - 1];
      if(newest.by !== session.slot){
        if(newest.result === "hit") playExplosion();
        announce("Your friend fired on " + newest.cell + ": " + newest.result + (newest.sunk ? (", sinking your " + newest.sunk + "!") : "."));
      }
    }
    render();
  }

  // ---------------- BOARD LAYOUT ----------------
  var LAYOUT_TEXT =
    "Board layout. The board has 10 rows and 10 columns. " +
    "Rows are lettered A to J, top to bottom. " +
    "Columns are numbered 1 to 10, left to right. " +
    "Every cell is one letter followed by one number, for example C4 or J10. " +
    "To place a ship, type the starting cell, then a space, then the letter H for horizontal or the letter V for vertical. " +
    "Example: D7 H means start at row D, column 7, going horizontal, across the columns to the right. " +
    "Example: D7 V means start at row D, column 7, going vertical, down through the rows.";

  function renderLayout(){
    app.innerHTML =
      '<div class="panel">' +
        '<h2>Board layout</h2>' +
        '<p class="status">The board is 10 rows by 10 columns.</p>' +
        '<ul class="ship-list">' +
          '<li>Rows are lettered A to J, top to bottom.</li>' +
          '<li>Columns are numbered 1 to 10, left to right.</li>' +
          '<li>Every cell is one letter then one number. Example: C4 or J10.</li>' +
          '<li>To place a ship, type the exact format: cell, space, then H for horizontal or V for vertical.</li>' +
          '<li>Example: D7 H — start at row D, column 7, going horizontal (across the columns, to the right).</li>' +
          '<li>Example: D7 V — start at row D, column 7, going vertical (down through the rows).</li>' +
        '</ul>' +
        '<p class="status">There is 1 ship to place for this test game: Destroyer (2 cells).</p>' +
        '<button type="button" class="primary" id="layoutContinueBtn">I understand — start placing ships</button>' +
      '</div>';
    focusHeading();
    announce(LAYOUT_TEXT + " There is 1 ship to place for this test game. Destroyer, 2 cells.");
    document.getElementById("layoutContinueBtn").onclick = function(){
      session.phase = "placement";
      render();
    };
  }

  // ---------------- PLACEMENT ----------------
  function renderPlacement(){
    if(session.shipIdx >= SHIPS.length){
      app.innerHTML =
        '<div class="panel">' +
          '<h2>Fleet placed</h2>' +
          '<p class="status">All ' + SHIPS.length + ' ship(s) are down. Review, then start the battle.</p>' +
          '<ul class="ship-list">' + session.fleet.map(function(s){
            return "<li>" + s.name + " (" + s.len + " cells): " + s.cells.join(", ") + "</li>";
          }).join("") + '</ul>' +
          '<button type="button" id="undoBtn">Remove last ship</button>' +
          '<button type="button" class="primary" id="readyBtn">Start battle</button>' +
        '</div>';
      focusHeading();
      document.getElementById("undoBtn").onclick = function(){
        session.fleet.pop(); session.shipIdx--; render();
      };
      document.getElementById("readyBtn").onclick = onReady;
      return;
    }
    var ship = SHIPS[session.shipIdx];
    app.innerHTML =
      '<div class="panel">' +
        '<h2>Place your ' + ship.name + ' (' + ship.len + ' cells)</h2>' +
        '<p class="status">' + session.shipIdx + ' of ' + SHIPS.length + ' ships placed so far.</p>' +
        '<label for="placeInput">Type the starting cell, a space, then H for horizontal or V for vertical. Example: D7 H</label>' +
        '<input type="text" id="placeInput" autocomplete="off">' +
        (session.error ? '<p class="error" role="alert">' + escapeHtml(session.error) + '</p>' : '') +
        '<button type="button" class="primary" id="placeBtn">Place ship</button>' +
      '</div>';
    focusHeading();
    announce("Place your " + ship.name + ", " + ship.len + " cells. Type the starting cell, a space, then H for horizontal or V for vertical. Example: D 7 H.");
    var input = document.getElementById("placeInput");
    input.focus();
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") doPlace(); });
    document.getElementById("placeBtn").onclick = doPlace;

    function doPlace(){
      var parsed = parsePlacement(input.value);
      if(!parsed){ session.error = 'Could not read that. Try a format like "D7 H".'; return render(); }
      var cells = shipCells(parsed, ship.len);
      if(!cells){ session.error = "That placement runs off the edge of the board. Try a different start cell or direction."; return render(); }
      var occupied = fleetOccupied(session.fleet);
      if(cells.some(function(c){ return occupied[c]; })){ session.error = "That overlaps a ship you already placed. Try another spot."; return render(); }
      session.error = "";
      session.fleet.push({name: ship.name, len: ship.len, cells: cells});
      session.shipIdx++;
      render();
    }
  }

  function onReady(){
    if(!roomRef){ session.error = "Lost connection to the game room. Go back and rejoin."; return render(); }
    var fleetForDb = session.fleet.map(function(s){ return {n: s.name, c: s.cells}; });
    var patch = {};
    patch[session.slot + "/ready"] = true;
    patch[session.slot + "/fleet"] = fleetForDb;
    roomRef.update(patch).then(function(){
      reconcile(roomDoc ? roomDoc.log.length : 0);
    }).catch(function(e){
      session.error = "Couldn't save your fleet (" + describeError(e) + "). Check your connection and try again.";
      render();
    });
  }

  // ---------------- WAITING ----------------
  function renderWaiting(){
    app.innerHTML =
      '<div class="panel">' +
        '<h2>Waiting for your friend</h2>' +
        '<p class="status">This updates automatically as soon as they finish.</p>' +
      '</div>';
    focusHeading();
    announce("Your fleet is set. Waiting for your friend to finish placing their ships.");
  }

  // ---------------- BATTLE ----------------
  function renderBattle(){
    var st = roomDoc || {turn:"p1", log:[], winner:null};
    var myTurn = st.turn === session.slot;
    var myShots = st.log.filter(function(e){ return e.by === session.slot; });
    var incoming = st.log.filter(function(e){ return e.by === otherSlot(session.slot); });

    app.innerHTML =
      '<div class="visible-announce">' + (myTurn ? "Your turn — call out a cell to fire on." : "Waiting for your friend's move...") + '</div>' +
      '<div class="panel">' +
        '<h2>Fire</h2>' +
        (myTurn ?
          '<label for="fireInput">Type the cell to fire on: one letter then one number. Example: D7</label>' +
          '<input type="text" id="fireInput" autocomplete="off">' +
          (session.error ? '<p class="error" role="alert">' + escapeHtml(session.error) + '</p>' : '') +
          '<button type="button" class="primary" id="fireBtn">Fire</button>'
          : '<p class="status">The board updates automatically the moment your friend fires.</p>') +
      '</div>' +
      '<div class="panel">' +
        '<h2>My fleet</h2>' +
        '<button type="button" id="readFleetBtn">Read my fleet</button>' +
        '<ul class="ship-list">' + renderMyFleet(st, incoming) + '</ul>' +
      '</div>' +
      '<div class="panel">' +
        '<h2>Game log</h2>' +
        '<button type="button" id="readMineBtn">Read my shots</button>' +
        '<button type="button" id="readTheirsBtn">Read hits on my fleet</button>' +
        '<ul class="log">' + renderLog(st.log) + '</ul>' +
      '</div>';

    if(myTurn){
      var input = document.getElementById("fireInput");
      input.focus();
      input.addEventListener("keydown", function(e){ if(e.key==="Enter") doFire(); });
      document.getElementById("fireBtn").onclick = doFire;
    }
    document.getElementById("readFleetBtn").onclick = function(){
      var mine = (st[session.slot] && st[session.slot].fleet) || [];
      if(mine.length===0){ announce("No fleet data found."); return; }
      var hitCells = incoming.filter(function(e){ return e.result==="hit"; }).map(function(e){ return e.cell; });
      announce("Your fleet: " + mine.map(function(s){
        var status = s.c.every(function(c){ return hitCells.indexOf(c) !== -1; }) ? "sunk" : "afloat";
        return s.n + " at " + s.c.join(", ") + ", " + status;
      }).join(". "));
    };
    document.getElementById("readMineBtn").onclick = function(){
      if(myShots.length===0){ announce("You haven't fired any shots yet."); return; }
      announce("Your shots: " + myShots.map(function(e){ return e.cell + " " + e.result + (e.sunk?(", sank the "+e.sunk):""); }).join(". "));
    };
    document.getElementById("readTheirsBtn").onclick = function(){
      if(incoming.length===0){ announce("Your fleet hasn't been fired on yet."); return; }
      announce("Shots against your fleet: " + incoming.map(function(e){ return e.cell + " " + e.result + (e.sunk?(", they sank your "+e.sunk):""); }).join(". "));
    };

    function doFire(){
      var input = document.getElementById("fireInput");
      var cell = parseCell(input.value);
      if(!cell){ session.error = 'Could not read that cell. Try a format like "D7".'; return renderBattle(); }
      if(myShots.some(function(e){ return e.cell === cell.key; })){
        session.error = "You already fired on " + cell.key + ". Pick a different cell.";
        return renderBattle();
      }
      session.error = "";
      playWhistle();

      var opponent = st[otherSlot(session.slot)];
      var fleet = (opponent && opponent.fleet) || [];
      var hitShip = null;
      fleet.forEach(function(s){ if(s.c.indexOf(cell.key) !== -1) hitShip = s; });

      var result = hitShip ? "hit" : "miss";
      var sunk = null;
      if(hitShip){
        var priorHits = myShots.filter(function(e){ return e.result==="hit"; }).map(function(e){ return e.cell; });
        var allHits = priorHits.concat([cell.key]);
        if(hitShip.c.every(function(c){ return allHits.indexOf(c) !== -1; })) sunk = hitShip.n;
      }

      var newLog = st.log.concat([{by: session.slot, cell: cell.key, result: result, sunk: sunk}]);
      var totalHits = newLog.filter(function(e){ return e.by===session.slot && e.result==="hit"; }).length;
      var winner = totalHits >= TOTAL_CELLS ? session.slot : null;
      var nextTurn = winner ? st.turn : otherSlot(session.slot);

      roomRef.update({log: newLog, winner: winner, turn: nextTurn}).then(function(){
        if(result === "hit") playExplosion();
        announce(result === "hit" ? ("Hit at " + cell.key + (sunk ? (". You sank their " + sunk + "!") : "!")) : ("Miss at " + cell.key + "."));
      }).catch(function(e){
        session.error = "Couldn't send that shot (" + describeError(e) + "). Check your connection and try again.";
        renderBattle();
      });
    }
  }

  function renderMyFleet(st, incoming){
    var mine = (st[session.slot] && st[session.slot].fleet) || [];
    if(mine.length===0) return '<li class="fine">No fleet data.</li>';
    var hitCells = incoming.filter(function(e){ return e.result==="hit"; }).map(function(e){ return e.cell; });
    return mine.map(function(s){
      var cellsText = s.c.map(function(c){ return hitCells.indexOf(c) !== -1 ? c + " (hit)" : c; }).join(", ");
      var sunk = s.c.every(function(c){ return hitCells.indexOf(c) !== -1; });
      return "<li>" + s.n + ": " + cellsText + (sunk ? " — sunk" : "") + "</li>";
    }).join("");
  }

  function renderLog(log){
    if(log.length===0) return '<li class="fine">No shots fired yet.</li>';
    return log.slice().reverse().map(function(e){
      var who = e.by === session.slot ? "You" : "Friend";
      var cls = e.result === "hit" ? "hit" : "miss";
      return '<li class="' + cls + '">' + who + " fired on " + e.cell + ": " + e.result + (e.sunk ? (" — sank the " + e.sunk + "!") : "") + '</li>';
    }).join("");
  }

  // ---------------- GAME OVER ----------------
  function renderGameOver(){
    var youWon = session.winner === session.slot;
    app.innerHTML =
      '<div class="panel">' +
        '<h2>' + (youWon ? "You won!" : "Your friend won") + '</h2>' +
        '<p class="status">' + (youWon ? "Every cell of their fleet is hit." : "Every cell of your fleet is hit.") + '</p>' +
        '<button type="button" class="primary" id="againBtn">Start a new game</button>' +
      '</div>';
    focusHeading();
    announce(youWon ? "Game over. You won!" : "Game over. Your friend won.");
    document.getElementById("againBtn").onclick = function(){
      if(roomRef) roomRef.set(freshRoom()).catch(function(){});
      if(roomListener && roomRef) roomRef.off("value", roomListener);
      roomRef = null; roomListener = null; roomDoc = null; startAttempted = false;
      localStorage.removeItem("bb3_code");
      localStorage.removeItem("bb3_slot");
      session.phase = "code"; session.code = ""; session.slot = "";
      session.occupancy = null; session.fleet = []; session.shipIdx = 0;
      session.error = ""; session.winner = null;
      render();
    };
  }

  render();
})();
</script>
</body>
</html>
